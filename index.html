<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Penguin Diner Co-op</title>
  <meta name="theme-color" content="#0e1b2c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="container py-3 d-flex justify-content-between align-items-center">
  <span class="brand h4 m-0">🐧 Penguin Diner</span>
  <span><span id="who" class="me-2 small"></span><button id="btnOut" class="btn btn-sm btn-outline-info d-none">Sign out</button></span>
</nav>

<main class="container pb-5">
  <!-- Lobby -->
  <section id="lobby" class="d-none">
    <h1 class="mb-4">Open the diner: solo or with up to 2 friends</h1>
    <div class="row g-4">
      <div class="col-md-6"><div class="card-ice p-4 h-100">
        <h2 class="h4">Host a room</h2><p>Play solo, or share the 4-letter code with up to 2 friends.</p>
        <button id="btnHost" class="btn btn-fish btn-lg">Host a room</button></div></div>
      <div class="col-md-6"><div class="card-ice p-4 h-100">
        <h2 class="h4">Join a room</h2>
        <input id="joinCode" class="form-control form-control-lg text-uppercase mb-3" maxlength="4" placeholder="ABCD">
        <button id="btnJoin" class="btn btn-fish btn-lg">Join room</button></div></div>
    </div>
    <p id="lobbyMsg" class="text-warning mt-3"></p>
  </section>

  <!-- Room waiting area -->
  <section id="room" class="d-none text-center">
    <div class="card-ice p-4 mx-auto" style="max-width:520px">
      <div>Room code</div><div id="roomCode" class="room-code"></div>
      <ul id="players" class="list-group list-group-flush my-3 text-start"></ul>
      <button id="btnReady" class="btn btn-fish btn-lg">I'm ready</button>
      <button id="btnStart" class="btn btn-fish btn-lg d-none">Start game</button>
      <button id="btnLeave" class="btn btn-link text-info mt-2">Leave room</button>
    </div>
  </section>

  <!-- Gameplay -->
  <section id="game" class="d-none">
    <div id="hud" class="d-flex justify-content-between flex-wrap gap-2"></div>
    <canvas id="canvas" width="800" height="450"></canvas>
    <div id="shop" class="d-none"><div class="card-ice p-4 text-center" style="max-width:440px;width:92%">
      <h2 id="shopTitle"></h2><p id="shopInfo"></p><div id="shopItems" class="d-grid gap-2 mb-3"></div>
      <button id="btnNext" class="btn btn-fish btn-lg">Start next day</button>
    </div></div>
  </section>
</main>

<!-- Forced auth modal -->
<div class="modal fade" id="authModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content card-ice text-light">
    <div class="modal-body p-4">
      <h2 class="h3 mb-3">Welcome to the diner</h2>
      <input id="authName" class="form-control mb-2" placeholder="Username (new accounts)">
      <input id="authEmail" type="email" class="form-control mb-2" placeholder="Email">
      <input id="authPass" type="password" class="form-control mb-3" placeholder="Password (6+ characters)">
      <div class="d-flex gap-2"><button id="btnSignIn" class="btn btn-fish flex-fill">Sign in</button>
      <button id="btnSignUp" class="btn btn-outline-info flex-fill">Create account</button></div>
      <p id="authMsg" class="text-warning mt-3 mb-0 small"></p>
    </div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
